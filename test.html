  <body>
    <script>
      Function.prototype.myCall = function (context, ...args) {
        context =
          context === null || context === undefined ? globalThis : context;
        const fn = this;
        const key = Symbol("key");
        context[key] = fn;
        context[key](...args);
        delete context[key];
      };

      const obj = {
        name: "zhou",
      };

      var name = "jun";

      function fn() {
        console.log(this);
        console.log(this.name)
      }

      fn();
    </script>
